logs = "Открыть папку с логами"
logs_hint = "Открыть папку с техническими логами MediaA."
repository = "Репозиторий GitHub"
contract_title = "Контракт сервера расшифровки"
contract_body = """
Это описание сервера, который вы подключаете как «Расшифровка». MediaA присылает один кусок записи и читает ответ. По этому тексту можно и самому понять формат, и попросить нейросеть написать сервер.

Адрес в карточке — корень сервера, без хвоста пути.

Запрос

POST {адрес}/v1/audio/transcriptions
Content-Type: multipart/form-data
Authorization: Bearer {ключ}

Если ключ пустой, заголовка Authorization нет.

Поля формы:
• model — имя модели с экрана «Модели».
• language — код языка интерфейса, например ru. Поля нет, если язык не задан.
• file — звук одного куска: WAV, 16 кГц, моно, 16 бит. Имя поля file, имя файла window.wav.

Время в ответе — секунды от начала этого файла, не всей записи. Метка спикера вроде «A» живёт только внутри этого ответа. В следующем куске «A» может быть другим человеком. Людей между кусками связывает MediaA.

Ответ — JSON. Лишние поля не мешают. Любой код не из диапазона 200–299 — ошибка, её текст виден человеку.

Поля ответа:
• text — весь текст куска. Нужен, если нет ни words, ни segments.
• words — слова. У каждого word, start и end. speaker можно не писать.
• segments — фразы: start, end, text, speaker. По ним MediaA узнаёт, кто говорил, если у слов нет speaker.
• speakers — один человек. id совпадает с speaker в words и segments. embedding — список чисел, одной длины у всех людей. По этим числам MediaA узнаёт голос в другом куске.

Что MediaA берёт:
• Текст берёт всегда.
• Время слов берёт, только если на модели включено «Время слов». Тогда words обязателен, иначе кусок — ошибка.
• Спикеров берёт, только если диаризация включена и на модели, и на этой записи. Тогда нужны segments со speaker.
• Отпечаток берёт только у подключения «Расшифровка», только вместе со спикерами и только если включён «Отпечаток». Тогда нужен speakers с embedding.

Проверка «Проверить модели» для этого подключения вызывает GET {адрес}/health и ждёт код 200. Список моделей не нужен.
"""
contract_example = """
{
  "text": "привет",
  "words": [
    {"word": "привет", "start": 0.12, "end": 0.48, "speaker": "A"}
  ],
  "segments": [
    {"start": 0.10, "end": 2.40, "text": "привет", "speaker": "A"}
  ],
  "speakers": [
    {"id": "A", "embedding": [0.01, -0.02]}
  ]
}
"""

