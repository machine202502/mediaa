repository = "GitHub repository"
contract_title = "Transcription server contract"
contract_body = """
This is the server you connect as Transcription. MediaA sends one slice of a recording and reads the answer. The text is enough to understand the format and to ask a model to write the server.

The address on the card is the server root, with no path appended.

Request

POST {address}/v1/audio/transcriptions
Content-Type: multipart/form-data
Authorization: Bearer {key}

If the key is empty, there is no Authorization header.

Form fields:
• model — the model name from the Models screen.
• language — the interface language code, for example ru. The field is omitted when no language is set.
• file — one slice of audio: WAV, 16 kHz, mono, 16-bit. The field name is file and the filename is window.wav.

Times in the answer are seconds from the start of this file, not of the whole recording. A speaker label such as "A" exists only inside this answer. In the next slice "A" may be a different person. MediaA links people across slices.

The answer is JSON. Extra fields are ignored. Any status outside 200–299 is an error, and its text is shown to the person.

Answer fields:
• text — the whole slice. Required when there are no words and no segments.
• words — each word, with word, start and end. speaker may be omitted.
• segments — phrases: start, end, text, speaker. MediaA uses them to name the person when words have no speaker.
• speakers — one person. id matches speaker in words and segments. embedding is a list of numbers, the same length for every person. MediaA uses these numbers to recognise the voice in another slice.

What MediaA reads:
• It always reads the text.
• It reads word times only when Word times is on for the model. Then words is required, and a slice without them is an error.
• It reads speakers only when diarization is on both for the model and for this recording. Then segments with speaker are required.
• It reads a voiceprint only for a Transcription connection, only together with speakers, and only when Voiceprint is on. Then speakers with embedding is required.

Check models, for this connection, calls GET {address}/health and expects status 200. A model list is not required.
"""
contract_example = """
{
  "text": "hello",
  "words": [
    {"word": "hello", "start": 0.12, "end": 0.48, "speaker": "A"}
  ],
  "segments": [
    {"start": 0.10, "end": 2.40, "text": "hello", "speaker": "A"}
  ],
  "speakers": [
    {"id": "A", "embedding": [0.01, -0.02]}
  ]
}
"""

