[package]
name = "mediaa"
description = "Cross-platform screenshots, screen recording and media conversion"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mediaa"
path = "src/main.rs"

[dependencies]
mediaa-core.workspace = true
mediaa-storage.workspace = true
mediaa-render.workspace = true
mediaa-media.workspace = true
mediaa-platform.workspace = true
anyhow.workspace = true
raw-window-handle = "0.6"
log.workspace = true
image.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
chrono.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "persistence", "x11", "wayland"] }
egui-phosphor = "0.14"
fontdb = "0.23"
global-hotkey = "0.8"
rfd = "0.17"
rust-i18n = "4"
sys-locale = "0.3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[build-dependencies]
ico = "0.4"
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu"] }
tempfile.workspace = true
toml.workspace = true
