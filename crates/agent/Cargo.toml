[package]
name = "mediaa-agent"
description = "Agent section of MediaA: the chat loop, tools, indexing, transcription and provider checks"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mediaa-core.workspace = true
mediaa-media.workspace = true
mediaa-engine.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
log.workspace = true
serde = { workspace = true }
serde_json = "1"
reqwest = { version = "0.13", features = ["blocking", "json", "socks", "query"] }
evalexpr = "13"
# The web: search results (DuckDuckGo HTML) and readable pages.
scraper = "0.27"
dom_smoothie = "0.18"
url = "2"
regex = "1"
minijinja = "2"
minijinja-embed = "2"

[dev-dependencies]
mediaa-engine = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tiny_http = "0.12"
insta = "1"

[build-dependencies]
minijinja-embed = "2"
