[package]
name = "mediaa-agent"
description = "Agent section of MediaA: the chat loop, tools, indexing, transcription and provider checks"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mediaa-core.workspace = true
mediaa-media.workspace = true
mediaa-engine.workspace = true
mediaa-queue.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
log.workspace = true
serde = { workspace = true }
serde_json = "1"
evalexpr = "13"
scraper = "0.27"
dom_smoothie = "0.18"
url = "2"
regex = "1"
minijinja = "2"
minijinja-embed = "2"
deunicode = "1"
keyring = "4"
ureq = { workspace = true }
hound = { workspace = true }

[dev-dependencies]
mediaa-engine = { workspace = true, features = ["testing"] }
tempfile.workspace = true
toml.workspace = true
tiny_http = "0.12"
insta = "1"
env_logger.workspace = true

[build-dependencies]
minijinja-embed = "2"
