[package]
name = "mediaa-agent"
description = "Agent section of MediaA: model downloads from Hugging Face, model and provider checks"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mediaa-core.workspace = true
mediaa-media.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
log.workspace = true
serde = { workspace = true }
serde_json = "1"
hf-hub = { version = "1", features = ["blocking"] }
reqwest = { version = "0.13", features = ["blocking", "json", "socks"] }
safetensors = "0.8"
memmap2 = "0.9"
evalexpr = "13"
llama-cpp-2 = "0.1.159"
libloading = "0.8"
# Speech: recognition (GigaAM), voice activity, diarization, speaker embeddings (ONNX Runtime inside).
sherpa-onnx = "1.13.8"
# The web: search results (DuckDuckGo HTML) and readable pages.
scraper = "0.27"
dom_smoothie = "0.18"
url = "2"
regex = "1"

# Windows: models run on any GPU with a Vulkan driver (NVIDIA, AMD, Intel), else on the CPU.
[target.'cfg(windows)'.dependencies]
llama-cpp-2 = { version = "0.1.159", features = ["vulkan"] }

[dev-dependencies]
tempfile.workspace = true
tiny_http = "0.12"
