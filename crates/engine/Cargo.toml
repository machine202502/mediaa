[package]
name = "mediaa-engine"
description = "Model engine of MediaA: language models, embeddings, reranking, speech, model downloads and the memory budget"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `mediaa_engine::testing::FakeEngine`: an engine without models for tests.
testing = []

[dependencies]
mediaa-core.workspace = true
anyhow.workspace = true
log.workspace = true
reqwest = { version = "0.13", features = ["blocking", "json", "socks"] }
hf-hub = { version = "1", features = ["blocking"] }
safetensors = "0.8"
memmap2 = "0.9"
llama-cpp-2 = "0.1.159"
libloading = "0.8"
# Speech: recognition (GigaAM), voice activity, diarization, speaker embeddings (ONNX Runtime inside).
sherpa-onnx = "1.13.8"
serde.workspace = true
serde_json = "1"

# Windows: models run on any GPU with a Vulkan driver (NVIDIA, AMD, Intel), else on the CPU.
[target.'cfg(windows)'.dependencies]
llama-cpp-2 = { version = "0.1.159", features = ["vulkan"] }

[dev-dependencies]
tempfile.workspace = true
