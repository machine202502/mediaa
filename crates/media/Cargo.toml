[package]
name = "mediaa-media"
description = "FFmpeg (statically linked via ez-ffmpeg) recording, muxing and conversion pipeline for MediaA"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
chrono.workspace = true
mediaa-core.workspace = true
mediaa-storage.workspace = true
mediaa-webp-pipeline.workspace = true
anyhow.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
image.workspace = true
image-webp = "0.2"
ez-ffmpeg = { version = "0.19", features = ["static"] }
oxipng = { version = "10.2", default-features = false, features = ["parallel"] }
tempfile.workspace = true

[dev-dependencies]
hound.workspace = true
