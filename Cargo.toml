[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/render",
    "crates/media",
    "crates/platform",
    "crates/engine",
    "crates/agent",
    "crates/queue",
    "crates/eval",
    "crates/app",
    "crates/webp-pipeline",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"

[workspace.lints.rust]
unused = "deny"
dead_code = "deny"

[workspace.dependencies]
mediaa-core = { path = "crates/core" }
mediaa-storage = { path = "crates/storage" }
mediaa-render = { path = "crates/render" }
mediaa-platform = { path = "crates/platform" }
mediaa-media = { path = "crates/media" }
mediaa-webp-pipeline = { path = "crates/webp-pipeline" }
mediaa-engine = { path = "crates/engine" }
mediaa-agent = { path = "crates/agent" }
mediaa-queue = { path = "crates/queue" }
mediaa-eval = { path = "crates/eval" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg", "bmp", "tiff"] }
hound = "3.5"
crossbeam-channel = "0.5"
parking_lot = "0.12"
log = { version = "0.4", features = ["std"] }
env_logger = "0.11"
fnv = "1"
directories = "6"
ureq = { version = "3", default-features = false, features = ["json", "socks-proxy", "rustls"] }
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev-check]
inherits = "dev"
debug = 0

[profile.dev-check.package."*"]
opt-level = 0

[profile.dev-check.package.mediaa-core]
opt-level = 0
[profile.dev-check.package.mediaa-storage]
opt-level = 0
[profile.dev-check.package.mediaa-render]
opt-level = 0
[profile.dev-check.package.mediaa-platform]
opt-level = 0
[profile.dev-check.package.mediaa-media]
opt-level = 0
[profile.dev-check.package.mediaa-webp-pipeline]
opt-level = 0

[profile.test-fast]
inherits = "dev"
debug = 0

[profile.test-fast.package."*"]
opt-level = 0

[profile.test-fast.package.mediaa-core]
opt-level = 2
[profile.test-fast.package.mediaa-storage]
opt-level = 2
[profile.test-fast.package.mediaa-render]
opt-level = 2
[profile.test-fast.package.mediaa-platform]
opt-level = 2
[profile.test-fast.package.mediaa-media]
opt-level = 2
[profile.test-fast.package.mediaa-engine]
opt-level = 2
[profile.test-fast.package.mediaa-agent]
opt-level = 2
[profile.test-fast.package.mediaa-queue]
opt-level = 2
[profile.test-fast.package.mediaa-eval]
opt-level = 2

[profile.dev.package."*"]
opt-level = 1
[profile.dev.package.mediaa-core]
opt-level = 2
[profile.dev.package.mediaa-storage]
opt-level = 2
[profile.dev.package.mediaa-render]
opt-level = 2
[profile.dev.package.mediaa-platform]
opt-level = 2
[profile.dev.package.mediaa-media]
opt-level = 2
[profile.dev.package.mediaa-engine]
opt-level = 2
[profile.dev.package.mediaa-agent]
opt-level = 2
[profile.dev.package.mediaa-queue]
opt-level = 2
[profile.dev.package.mediaa-eval]
opt-level = 2
