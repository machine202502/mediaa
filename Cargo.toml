[workspace]
resolver = "2"
members = ["crates/core", "crates/media", "crates/platform", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
mediaa-core = { path = "crates/core" }
mediaa-platform = { path = "crates/platform" }
mediaa-media = { path = "crates/media" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg", "bmp", "tiff"] }
hound = "3.5"
crossbeam-channel = "0.5"
log = { version = "0.4", features = ["std"] }
env_logger = "0.11"
directories = "6"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.mediaa-platform]
opt-level = 3
[profile.dev.package.mediaa-media]
opt-level = 3
