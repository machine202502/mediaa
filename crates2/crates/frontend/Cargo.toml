[package]
name = "mediaa2-frontend"
description = "MediaA 2 egui frontend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mediaa2-core.workspace = true
mediaa2-i18n.workspace = true
mediaa2-protocol.workspace = true
mediaa2-platform.workspace = true
mediaa2-media.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
log.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
rust-i18n.workspace = true
tokio = { workspace = true, features = ["net", "rt", "macros", "io-util", "time", "sync"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "persistence", "x11", "wayland"] }
egui-phosphor = "0.14"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
